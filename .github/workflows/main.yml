name: Quy Trinh DevOps Dau Tien Cua Vinh

on:
  push:
    branches: [ "main" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # BƯỚC MỚI: Build Docker Image
      - name: Build Docker Image
        run: |
          echo "Dang dong goi code vao Container..."
          # Lệnh build docker
          docker build -t my-web-app:v1 . 
          echo "Dong goi thanh cong!"

      # BƯỚC MỚI: Kiểm tra xem Image đã có chưa
      - name: Kiem tra Image
        run: docker images
