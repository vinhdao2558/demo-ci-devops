name: Quy Trinh DevOps Hoan Chinh

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # BƯỚC 1: Đăng nhập vào Docker Hub (Tự động lấy user/pass từ Secrets bạn vừa tạo)
      - name: Dang nhap Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BƯỚC 2: Build & Push
      - name: Build va Push Docker Image
        run: |
          echo "Bat dau build va day len Docker Hub..."
          
          # Cấu trúc lệnh: docker build -t [USERNAME]/[TEN-IMAGE]:[TAG] .
          # ${{ secrets.DOCKER_USERNAME }} sẽ tự điền vinhdao2558 vào
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-web-app:v1 .
          docker push ${{ secrets.DOCKER_USERNAME }}/my-web-app:v1
          
          echo "Thanh cong! Da day len kho Docker Hub."
